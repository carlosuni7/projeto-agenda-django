{% load django_bootstrap5 %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    {% bootstrap_css %}
    <title>Exclusão de Contato</title>
</head>
<body>

    <div class="container">
        <form action="{% url 'excContato' contato.id %}" method="POST">
            {% csrf_token %}

            <h2>Confirmar Exclusão? Esse processo é irreversível</h2>
            <div class="Caixa">
                Nome: {{ contato.Nome }}
                e-mail: {{ contato.Email }}
                Data de Nascimento: {{ contato.DtaNas}}
            </div>
            
            <input type="submit" class="btn btn-danger" value="Confirmar">
        </form>
    </div>

    {% bootstrap_javascript %}
</body>
</html>
